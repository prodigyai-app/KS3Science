<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KS3 printable practice</title><style>body{font:12pt/1.5 Arial,sans-serif;max-width:780px;margin:32px auto;padding:0 20px;color:#111}h1{font-size:22pt}h2{font-size:15pt}.part{break-inside:avoid;margin:22px 0}.working{height:108px;border-bottom:1px solid #aaa;background:repeating-linear-gradient(white,white 25px,#ddd 26px,white 27px)}.actions{padding:18px;border:1px solid #ddd}button{padding:10px 20px;font:inherit}.marks{float:right;font-weight:bold}@media print{.actions{display:none}body{margin:0;max-width:none}@page{size:A4;margin:18mm}}</style><div class="actions"><button onclick="window.print()">Print / save as PDF</button> Use your browser’s print dialog.</div><main id="paper">Loading…</main><script src="course-data.js"></script><script>
(()=>{'use strict';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const args=new URLSearchParams(location.search),p=KS_PAPERS.find(p=>p.id===args.get('paper')),answers=args.get('answers')==='1',el=document.getElementById('paper');if(!p){el.innerHTML='<h1>Paper not found</h1><p>Choose a paper from the course page.</p>';return;}document.title=KS_COURSE.title+' · '+p.title+(answers?' · mark scheme':' · questions');el.innerHTML=`<h1>${esc(KS_COURSE.title)} · ${esc(p.title)}${answers?' · Mark scheme':''}</h1><p>${p.marks} marks · suggested ${p.minutes} minutes</p><p><b>Original unofficial Prodigy practice.</b> Not a copy of your school assessment. No official grade boundaries. The two year papers sample different topics.</p>${answers?'<p>Award one mark per distinct valid aspect. Accept equivalent correct reasoning. A final value alone does not demonstrate all method marks.</p>':'<p>Name: _______________________ Date: ______________</p><p>Answer all questions, show working and give units. Follow your teacher’s instructions on calculator use.</p>'}${p.questions.map((q,i)=>q.parts.map(a=>`<section class="part"><span class="marks">[${a.m}]</span><h2>${i+1}</h2><p>${esc(a.q)}</p>${answers?'<ol>'+a.ms.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>':'<div class="working"></div>'}</section>`).join('')).join('')}<p>End · Total ${p.marks} marks</p>`;})();
</script></html>
