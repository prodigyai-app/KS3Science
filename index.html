<style>
/* Layout: practical switcher, then each lab = live apparatus stage beside a control panel, with results and worked solutions underneath */
:root{
  --bg:#e9edee; --panel:#fbfcfc; --sunk:#dfe5e7; --ink:#162024; --muted:#54636a; --line:#cbd5d9;
  --accent:#c4531a; --accent-soft:#f6e3d8; --on-accent:#ffffff; --data:#1b6788; --good:#2c7a4c; --bad:#b1352a;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101619; --panel:#172024; --sunk:#0c1214; --ink:#e4eaec; --muted:#93a2a9; --line:#2a373c;
  --accent:#ee8346; --accent-soft:#3a2418; --on-accent:#1a0e07; --data:#62b4d3; --good:#5fc08a; --bad:#f07a6c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101619; --panel:#172024; --sunk:#0c1214; --ink:#e4eaec; --muted:#93a2a9; --line:#2a373c;
  --accent:#ee8346; --accent-soft:#3a2418; --on-accent:#1a0e07; --data:#62b4d3; --good:#5fc08a; --bad:#f07a6c; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-stretch:82%;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,3.2vw,2.2rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.45rem,2.8vw,1.95rem);font-weight:750}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.muted{color:var(--muted)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand{display:flex;gap:14px;align-items:center}
.brand svg{flex:none}
.brand p{color:var(--muted);font-size:.95rem}
.switcher{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.prac{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);transition:border-color .15s}
.prac:hover{border-color:var(--muted)}
.prac:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.prac[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.prac .ico{grid-row:span 2;width:40px;height:40px;border-radius:8px;background:var(--sunk);display:grid;place-items:center}
.prac .lvl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prac .nm{font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.08rem;line-height:1.15}

/* lab layout */
.lab{display:flex;flex-direction:column;gap:18px}
.lab-head{display:flex;flex-direction:column;gap:6px;max-width:70ch}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:960px){.bench{grid-template-columns:minmax(0,1fr)}}
.stage{border-radius:var(--r);overflow:hidden;background:#1d2224;box-shadow:0 1px 0 rgba(0,0,0,.05),0 8px 24px -12px rgba(0,0,0,.35);position:relative;min-width:0}
.stage svg,.stage canvas{display:block;width:100%;height:auto}
.stage-bar{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;background:#15191b;color:#c9d2d5;font-family:var(--f-mono);font-size:.74rem}
.stage-bar b{color:#fff;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
.field{display:flex;flex-direction:column;gap:7px}
.lbl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.lbl i,.lbl output i{text-transform:none;font-family:Georgia,serif;font-size:1.1em}
.lbl output{color:var(--ink);font-weight:600;letter-spacing:0;text-transform:none}
.seg{display:grid;gap:6px}
.seg.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.c1{grid-template-columns:minmax(0,1fr)}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;pointer-events:none}
.opt span{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:.88rem;line-height:1.2;min-height:38px;background:var(--panel)}
.opt input:checked + span{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.opt input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}
.opt input:disabled + span{opacity:.45;cursor:not-allowed}
.sw{width:18px;height:18px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.2)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row > *{min-width:0}
select,input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:38px}
input[type=number]{width:84px;font-family:var(--f-mono);font-size:.9rem}
input[type=range]{width:100%;accent-color:var(--accent)}
.slider{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.check input{accent-color:var(--accent);width:17px;height:17px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:600;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:1rem}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.step-tag{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.readout div{background:var(--sunk);padding:7px 10px;display:flex;flex-direction:column}
.readout span{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.readout b{font-family:var(--f-mono);font-size:1.05rem;font-variant-numeric:tabular-nums;font-weight:600}
.readout.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:520px){.readout.c5{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* lower area */
.lower{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:960px){.lower{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.02em;color:var(--muted);font-weight:600;text-align:right}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--f-mono);font-size:.86rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.empty{color:var(--muted);font-size:.92rem;padding:10px 0}
.results-tables{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px}
@media (max-width:620px){.results-tables{grid-template-columns:minmax(0,1fr)}}
.graph{width:100%;height:auto;display:block;border-radius:8px;background:var(--sunk)}
details{border-top:1px solid var(--line);padding-top:10px}
details:first-of-type{border-top:0;padding-top:0}
summary{cursor:pointer;font-family:var(--f-display);font-stretch:85%;font-weight:700;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);color:var(--muted);font-weight:400}
details[open] summary::after{content:"−"}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:8px;padding-top:8px;font-size:.96rem}
.prose ol,.prose ul{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.vars{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px}
.vars dt{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:3px}
.vars dd{margin:0}
.ans{background:var(--sunk);border-radius:8px;padding:8px 12px}

/* worked solution */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk);display:flex;flex-direction:column;gap:2px}
.chip span{font-family:var(--f-mono);font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.chip b{font-family:var(--f-mono);font-size:1.1rem;font-variant-numeric:tabular-nums}
.chip.key{border-color:var(--accent);background:var(--accent-soft)}
.work{display:flex;flex-direction:column;gap:12px}
.wstep{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 12px}
.wstep .n{grid-row:span 3;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem}
.wstep h4{margin:4px 0 0;font-family:var(--f-display);font-stretch:85%;font-size:1.02rem}
.wstep .why{color:var(--muted);font-size:.92rem}
.eqs{display:flex;flex-direction:column;gap:6px;overflow-x:auto;padding:2px 0}
.eq{font-family:var(--f-mono);font-size:.9rem;display:flex;align-items:center;flex-wrap:nowrap;gap:.35em;white-space:nowrap}
.eq .tx{white-space:normal;min-width:0;flex:1 1 auto;line-height:1.5}
.eq i{font-family:"Times New Roman",Georgia,serif;font-size:1.12em}
.eq .res{background:var(--accent-soft);border:1px solid var(--accent);border-radius:5px;padding:0 6px;font-weight:600}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.25}
.fr > span{padding:0 3px}
.fr > span:first-child{border-bottom:1.5px solid currentColor}
.sq{display:inline-flex;align-items:flex-start}
.sq > span{border-top:1.5px solid currentColor;padding:1px 3px 0}
.veiled{position:relative}
.veiled > .veil-body{filter:blur(7px);user-select:none;pointer-events:none}
.veil-msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:16px;font-weight:600}
.veiled > .veil-msg{display:grid}
.veil-msg span{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;max-width:34ch}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.preset{all:unset;cursor:pointer;border:1px dashed var(--line);border-radius:8px;padding:9px 12px;font-size:.92rem;line-height:1.35}
.preset:hover{border-color:var(--accent)}
.preset:focus-visible{outline:2px solid var(--accent)}
.preset b{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.pred{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pred label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.pred input{width:100%}
.pred-res{font-size:.92rem}
.ok{color:var(--good);font-weight:700}
.no{color:var(--bad);font-weight:700}

/* navigation groups */
.nav{display:flex;flex-direction:column;gap:14px}
.navgroup{display:flex;flex-direction:column;gap:8px}
.navgroup .switcher{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.prac .ico{width:36px;height:36px;color:var(--ink)}
.prac[aria-selected="true"] .ico{background:var(--accent);color:var(--on-accent)}
/* revealable answers */
details.reveal{border:0;padding:0}
details.reveal summary{font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);justify-content:flex-start;gap:6px}
details.reveal summary::after{content:""}
details.reveal summary::before{content:"▸"}
details.reveal[open] summary::before{content:"▾"}
details.reveal .ans{margin-top:6px}
/* tables */
td.xc{width:28px;padding:2px 4px}
button.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem;line-height:1;padding:3px 6px;border-radius:5px}
button.x:hover{background:var(--sunk);color:var(--bad)}
.seg.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.readout.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.readout.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.steps{display:flex;flex-direction:column;gap:6px}
.steps button{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;cursor:pointer;font-size:.9rem;line-height:1.25;min-height:40px}
.steps button .k{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.steps button.done{color:var(--muted)}
.steps button.done .k{background:var(--good);border-color:var(--good);color:#fff}
.steps button.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.steps button.next .k{border-color:var(--accent);color:var(--accent)}
.steps button:disabled{cursor:not-allowed;opacity:.55}
.schem{background:var(--sunk);border-radius:8px;padding:8px;display:flex;justify-content:center}
.schem svg{width:100%;max-width:300px;height:auto}
.schem svg *{stroke:var(--ink)}
.schem svg text{fill:var(--ink);stroke:none}
.note{font-size:.88rem;color:var(--muted)}
.warn{font-size:.88rem;color:var(--bad);font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.stage canvas{touch-action:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.listmode .navgroup .switcher{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.listmode .prac{grid-template-columns:auto 1fr;align-items:start;align-content:start;padding:14px 16px}
.listmode .prac .ico{grid-row:span 3}
.listmode .prac .desc{grid-column:2;font-size:.88rem;line-height:1.4;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.listmode .prac:hover{border-color:var(--accent)}
#list-intro{margin:-4px 0 14px}
.pnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:0 0 18px}
.pnav.bot{margin:22px 0 6px}
.pnav .btn{min-height:40px;padding:6px 14px;width:auto}
.pnav .pn-pos{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.pnav .pn-sp{flex:1}
.pnav .pn-t{display:inline-block;max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.pnav.top{position:sticky;top:0;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.06)}
@media (max-width:640px){.pnav.top{position:static}.pnav .pn-t{max-width:11ch}.pnav .pn-sp{display:none}.pnav .pn-pos{order:-1;flex-basis:100%}.pnav .pn-list{flex:1 1 100%}.pnav .pn-prev,.pnav .pn-next{flex:1 1 40%}.listmode .navgroup .switcher{grid-template-columns:1fr}}
</style><style>
/* ---------- learning pages ---------- */
.lsec{display:flex;flex-direction:column;gap:18px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.lcard>h3{font-size:1.25rem;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.lcard>h3 .kind{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:var(--accent);padding:3px 7px;border-radius:5px;font-weight:600;font-stretch:normal}
.lcard>h3 .kind.k-sim{background:var(--data);color:#fff}
.lcard>h3 .kind.k-ex{background:#6b4fa0;color:#fff}
.lcard>h3 .kind.k-chk{background:var(--good);color:#fff}
.lcard>h3 .kind.k-prac{background:#8a6234;color:#fff}
.prose{font-size:1.02rem;line-height:1.6}
.prose p{margin:0 0 .75em}.prose p:last-child{margin-bottom:0}
.prose ul,.prose ol{margin:.2em 0 .8em;padding-left:1.3em}.prose li{margin:.25em 0}
.prose b{font-weight:700}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.fig{margin:0;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:.85rem;color:var(--muted);margin-top:6px;line-height:1.4}
.lo{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.lo li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:1rem}
.lo li::before{content:"";width:14px;height:14px;margin-top:4px;border:2px solid var(--accent);border-radius:4px}
.lo .ref{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:6px}
.eqbox{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.eqbox>div{font-family:var(--f-mono);font-size:1.02rem;background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:8px 14px;display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.eqbox>div small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);margin-left:6px}
.kp{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.kp li{padding:8px 12px;border-radius:6px;background:var(--sunk);border-left:4px solid var(--good)}
.kp.kbad li{border-left-color:var(--bad)}
.kp li b{font-weight:700}
.ex .exq{font-size:1.02rem;padding:10px 14px;background:var(--sunk);border-radius:8px;margin-bottom:12px}
.ex .exs{display:flex;flex-direction:column;gap:10px}
.ex .exs .wstep[hidden]{display:none}
.ex .exbtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ex .exbtns .btn{width:auto;min-height:38px;padding:6px 14px}

/* thermometer: returns svg; setThermo(id,T) moves the column. visible scale from yTop+14 to yTop+scaleLen */
const thermoMap={};
C.thermo=(x,yTop,len,id,{tMin=-10,tMax=110,scaleLen=null}={})=>{
  const s0=yTop+14, s1=yTop+(scaleLen||len-40), k=(s1-s0)/(tMax-tMin), bot=yTop+len-12;
  thermoMap[id]={y:T=>s1-(T-tMin)*k,bot};
  let ticks=""; for(let T=tMin;T<=tMax;T++){ const y=(s1-(T-tMin)*k).toFixed(2), L=T%10===0?5.5:T%5===0?3.8:2.2;
    if(k<1.2&&T%5&&T%10) continue;
    ticks+=`<line x1="${x-2}" x2="${x-2+L}" y1="${y}" y2="${y}" stroke="#1d1d1d" stroke-width="${T%10===0?.55:.35}"/>`;
    if(T%20===0) ticks+=`<text x="${x+7}" y="${(+y+1.6).toFixed(2)}" font-size="4.4" text-anchor="end" font-family="Arial" fill="#1d1d1d">${T}</text>`; }
  return `<g><rect x="${x-8}" y="${yTop}" width="16" height="${len}" rx="8" fill="url(#g-thGlass)" stroke="#9fb6be" stroke-width=".6"/>
<rect x="${x-2}" y="${s0-4}" width="9" height="${s1-s0+8}" rx="1" fill="#f7f5ec" opacity=".95"/>${ticks}
<rect x="${x-4.6}" y="${yTop+6}" width="2.2" height="${len-12}" fill="#fff" opacity=".65"/>
<rect id="${id}" x="${x-4.4}" y="${s1}" width="1.8" height="${bot-s1}" fill="url(#g-red)"/>
<ellipse cx="${x}" cy="${bot+2}" rx="6.5" ry="11" fill="#d42a22" stroke="#8f1414" stroke-width=".8"/><ellipse cx="${x-2}" cy="${bot-2}" rx="2" ry="4.5" fill="#fff" opacity=".55"/>
<rect x="${x-6.5}" y="${yTop}" width="3" height="${len-10}" rx="1.5" fill="#fff" opacity=".45"/></g>`; };
function setThermo(id,T){ const m=thermoMap[id], el=document.getElementById(id); if(!m||!el) return; const y=m.y(T); el.setAttribute("y",y.toFixed(2)); el.setAttribute("height",Math.max(0,m.bot-y).toFixed(2)); return y; }

/* wooden rule. horizontal: from (x,y) length len px for cm cm; vertical if vert */
C.rule=(x,y,lenCm,px,{vert=false,w=26,label="",major=10,from=0}={})=>{ const L=lenCm*px; let t="";
  const mm=px>=7;
  for(let i=0;i<=lenCm*(mm?10:2);i++){ const cm=i/(mm?10:2), p=(cm*px).toFixed(2), isCm=Math.abs(cm-Math.round(cm))<1e-6, half=Math.abs(cm*2-Math.round(cm*2))<1e-6;
    const l=isCm?(Math.round(cm)%major===0?w*.5:w*.36):half?w*.26:w*.16;
    t+=vert?`<line x1="${x}" x2="${x+l}" y1="${y+ +p}" y2="${y+ +p}" stroke="#222" stroke-width="${isCm?.8:.5}"/>`:`<line x1="${x+ +p}" x2="${x+ +p}" y1="${y}" y2="${y+l}" stroke="#222" stroke-width="${isCm?.8:.5}"/>`;
    const step=px>=14?1:px>=6?5:10;
    if(isCm&&Math.round(cm)%step===0){ const v=Math.round(cm)+from; t+=vert?`<text x="${x+w*.62}" y="${y+ +p+3}" font-family="Arial" font-size="${Math.min(9,px*1.1+3)}" fill="#222">${v}</text>`:`<text x="${x+ +p}" y="${y+w*.86}" text-anchor="middle" font-family="Arial" font-size="${Math.min(9,px*1.1+3)}" fill="#222">${v}</text>`; } }
  return vert?`<rect x="${x-3}" y="${y-8}" width="${w}" height="${L+16}" fill="url(#g-woodV)" filter="url(#g-woodgrain)"/><rect x="${x-3}" y="${y-8}" width="${w}" height="${L+16}" fill="none" stroke="#9c7b45" stroke-width=".6"/>${t}${label?`<text x="${x+w*.5}" y="${y+L*.5}" font-family="Arial" font-size="6" fill="#6b4e1f" transform="rotate(90 ${x+w*.5} ${y+L*.5})" text-anchor="middle">${label}</text>`:""}`
   :`<rect x="${x-8}" y="${y-3}" width="${L+16}" height="${w}" fill="url(#g-wood)" filter="url(#g-woodgrain)"/><rect x="${x-8}" y="${y-3}" width="${L+16}" height="${w}" fill="none" stroke="#9c7b45" stroke-width=".6"/>${t}`; };

C.micro=(x,y,r,wireCol="#c8784a")=>{ const rr=r==null?0:r, x0=x+30, y0=y+46, sl=Math.floor(rr*2+1e-9)/2, th=(rr-sl)*100, tx=x0+164+rr*20;
  let tk=""; for(let k=-6;k<=6;k++){ const v=((Math.round(th)+k)%50+50)%50, yy=y0+(k-(th-Math.round(th)))*-6; tk+=`<line x1="${tx}" x2="${tx+(v%5===0?10:6)}" y1="${yy}" y2="${yy}" stroke="#222" stroke-width=".7"/>${v%5===0?`<text x="${tx+13}" y="${yy+2.5}" font-family="Arial" font-size="6" fill="#222">${v}</text>`:""}`; }
  let sc=""; for(let h=0;h<=Math.round(sl*2);h++){ const xx=x0+162+h*10; sc+=`<line x1="${xx}" x2="${xx}" y1="${h%2?y0:y0-6}" y2="${h%2?y0+6:y0}" stroke="#222" stroke-width=".8"/>${h%2===0?`<text x="${xx-2}" y="${y0-9}" font-family="Arial" font-size="6" fill="#222">${h/2}</text>`:""}`; }
  const sx=x0+66+rr*30;
  return `<rect x="${x}" y="${y}" width="350" height="140" rx="8" fill="#e9ecea" stroke="#9ea39c"/><text x="${x+12}" y="${y+16}" font-family="'JetBrains Mono',monospace" font-size="9" fill="#5b6268">MICROMETER · CLOSE-UP</text>

/* ---------------- canvas graph ---------------- */
function plot(cv,o){
  if(!cv||!cv.offsetParent) return null;
  const w=cv.clientWidth, h=Math.round(w*(o.aspect||.64)), dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  const ink=css("--ink"), mut=css("--muted"), line=css("--line"), panel=css("--panel"), mono=css("--f-mono");
  const S=(o.series||[]).filter(s=>s.pts&&s.pts.length);
  const all=S.flatMap(s=>s.pts);
  const rng=(ax,i)=>{ let lo=ax.min, hi=ax.max; const vals=all.map(p=>p[i]);
    if(lo==null) lo=vals.length?Math.min(...vals):(ax.def||[0,10])[0]; if(hi==null) hi=vals.length?Math.max(...vals):(ax.def||[0,10])[1];
    if(ax.zero!==false){ if(ax.min==null) lo=Math.min(0,lo); if(ax.max==null) hi=Math.max(0,hi); }
    if(hi-lo<1e-9){ hi=lo+(ax.span||1); }
    const st=nice(hi-lo,ax.n||6); if(ax.min==null) lo=Math.floor(lo/st+1e-9)*st; if(ax.max==null) hi=Math.ceil(hi/st-1e-9)*st; if(hi<=lo) hi=lo+st;
    return [lo,hi,nice(hi-lo,ax.n||6)]; };
  const [x0,x1,xs]=rng(o.x,0), [y0,y1,ys]=rng(o.y,1);
  const L=58,R=16,T=16,B=44, pw=w-L-R, ph=h-T-B;
  const X=v=>L+(v-x0)/(x1-x0)*pw, Y=v=>T+(y1-v)/(y1-y0)*ph;
  const dec=st=>Math.max(0,-Math.floor(Math.log10(st)+1e-9));
  c.lineWidth=1;
  for(let v=x0;v<=x1+xs*1e-6;v+=xs/5){ c.strokeStyle=line; c.globalAlpha=Math.abs(((v-x0)/xs)-Math.round((v-x0)/xs))<1e-6?1:.45; c.beginPath(); c.moveTo(Math.round(X(v))+.5,T); c.lineTo(Math.round(X(v))+.5,T+ph); c.stroke(); }
  for(let v=y0;v<=y1+ys*1e-6;v+=ys/5){ c.strokeStyle=line; c.globalAlpha=Math.abs(((v-y0)/ys)-Math.round((v-y0)/ys))<1e-6?1:.45; c.beginPath(); c.moveTo(L,Math.round(Y(v))+.5); c.lineTo(L+pw,Math.round(Y(v))+.5); c.stroke(); }
  c.globalAlpha=1; c.strokeStyle=mut; c.lineWidth=1.4;
  const ax0=(x0<=0&&x1>=0)?X(0):L, ay0=(y0<=0&&y1>=0)?Y(0):T+ph;
  c.beginPath(); c.moveTo(ax0,T); c.lineTo(ax0,T+ph); c.moveTo(L,ay0); c.lineTo(L+pw,ay0); c.stroke();
  c.fillStyle=mut; c.font=`11.5px ${mono}`; c.textAlign="center"; c.textBaseline="top";
  for(let v=x0;v<=x1+xs*1e-6;v+=xs) c.fillText((Math.abs(v)<xs*1e-6?0:v).toFixed(dec(xs)),X(v),T+ph+6);
  c.fillText(o.x.label,L+pw/2,T+ph+24);
  c.textAlign="right"; c.textBaseline="middle";
  for(let v=y0;v<=y1+ys*1e-6;v+=ys) c.fillText((Math.abs(v)<ys*1e-6?0:v).toFixed(dec(ys)),L-6,Y(v));
  c.save(); c.translate(13,T+ph/2); c.rotate(-Math.PI/2); c.textAlign="center"; c.fillText(o.y.label,0,0); c.restore();
  if(!S.length&&!(o.fits||[]).length){ c.textAlign="center"; const msg=o.empty||"Readings will be plotted here"; if(c.measureText(msg).width>pw-16){ const w=msg.split(" "), h=Math.ceil(w.length/2); c.fillText(w.slice(0,h).join(" "),L+pw/2,T+ph/2-8); c.fillText(w.slice(h).join(" "),L+pw/2,T+ph/2+8); } else c.fillText(msg,L+pw/2,T+ph/2); return null; }
  c.save(); c.beginPath(); c.rect(L,T,pw,ph); c.clip();
  (o.fits||[]).forEach(f=>{ c.strokeStyle=f.col||ink; c.lineWidth=1.6; c.globalAlpha=.9; c.setLineDash(f.dash||[]); c.beginPath();
    if(f.fn){ for(let i=0;i<=120;i++){ const xv=f.x0+(f.x1-f.x0)*i/120; const yv=f.fn(xv); i?c.lineTo(X(xv),Y(yv)):c.moveTo(X(xv),Y(yv)); } }
    else { c.moveTo(X(f.x0),Y(f.m*f.x0+f.c)); c.lineTo(X(f.x1),Y(f.m*f.x1+f.c)); }
    c.stroke(); c.setLineDash([]); c.globalAlpha=1; });
  if(o.tri){ const t=o.tri, ya=t.m*t.xa+t.c, yb=t.m*t.xb+t.c; c.strokeStyle=css("--data"); c.fillStyle=css("--data"); c.lineWidth=1.3; c.setLineDash([5,4]);
    c.beginPath(); c.moveTo(X(t.xa),Y(ya)); c.lineTo(X(t.xb),Y(ya)); c.lineTo(X(t.xb),Y(yb)); c.stroke(); c.setLineDash([]);
    c.font=`600 11px ${mono}`; c.textAlign="center"; c.textBaseline="top"; c.fillText(t.dxl||"Δx",(X(t.xa)+X(t.xb))/2,Y(ya)+(yb>ya?4:-16));
    const dw=c.measureText(t.dyl||"Δy").width; const right=X(t.xb)+8+dw<L+pw; c.textAlign=right?"left":"right"; c.textBaseline="middle"; c.fillText(t.dyl||"Δy",X(t.xb)+(right?5:-5),(Y(ya)+Y(yb))/2); }
  S.forEach(s=>{
    const pts=s.sort===false?s.pts:s.pts.slice().sort((a,b)=>a[0]-b[0]);
    if(s.join){ c.strokeStyle=s.col; c.lineWidth=1.8; c.globalAlpha=.85; c.beginPath();
      const P=pts.map(([a,b])=>[X(a),Y(b)]);
      P.forEach((p,i)=>{ if(!i){ c.moveTo(p[0],p[1]); return; } if(s.join!=="curve"){ c.lineTo(p[0],p[1]); return; }
        const p0=P[i-2]||P[i-1], p1=P[i-1], p3=P[i+1]||p; c.bezierCurveTo(p1[0]+(p[0]-p0[0])/6,p1[1]+(p[1]-p0[1])/6,p[0]-(p3[0]-p1[0])/6,p[1]-(p3[1]-p1[1])/6,p[0],p[1]); });
      c.stroke(); c.globalAlpha=1; }
    c.strokeStyle=s.col; c.lineWidth=1.7;
    if(s.ey||s.ex){ c.lineWidth=1.1; c.globalAlpha=.75; s.pts.forEach(([xv,yv],i)=>{ const x=X(xv),y=Y(yv), ey=s.ey?(Array.isArray(s.ey)?s.ey[i]:s.ey):0, ex=s.ex?(Array.isArray(s.ex)?s.ex[i]:s.ex):0;
      if(ey){ const y1=Y(yv+ey), y2=Y(yv-ey); c.beginPath(); c.moveTo(x,y1); c.lineTo(x,y2); c.moveTo(x-4,y1); c.lineTo(x+4,y1); c.moveTo(x-4,y2); c.lineTo(x+4,y2); c.stroke(); }
      if(ex){ const x1=X(xv-ex), x2=X(xv+ex); c.beginPath(); c.moveTo(x1,y); c.lineTo(x2,y); c.moveTo(x1,y-4); c.lineTo(x1,y+4); c.moveTo(x2,y-4); c.lineTo(x2,y+4); c.stroke(); } }); c.globalAlpha=1; c.lineWidth=1.7; }
    if(!s.noPts) s.pts.forEach(([xv,yv],i)=>{ const x=X(xv),y=Y(yv),k=3.8; const hl=s.mark&&s.mark[i]; c.globalAlpha=hl?.35:1; c.beginPath(); c.moveTo(x-k,y-k); c.lineTo(x+k,y+k); c.moveTo(x+k,y-k); c.lineTo(x-k,y+k); c.stroke(); if(hl){ c.beginPath(); c.arc(x,y,7,0,Math.PI*2); c.stroke(); } c.globalAlpha=1; });
  });
  c.restore();
  const lab=S.filter(s=>s.label).concat((o.fits||[]).filter(f=>f.label).map(f=>({label:f.label,col:f.col||ink,line:true})));
  if(lab.length){ c.textAlign="left"; c.textBaseline="middle"; c.font=`11px ${css("--f-body")}`; let ly=T+10;
    const right=o.legend!=="left";

  return {X,Y,x0,x1,y0,y1};
}
/* simple bar chart: items [{label, v, ref, col}] */
function bars(cv,o){
  if(!cv||!cv.offsetParent) return;
  const w=cv.clientWidth, h=Math.round(w*(o.aspect||.64)), dpr=window.devicePixelRatio||1;
  cv.width=w*dpr; cv.height=h*dpr; cv.style.height=h+"px";
  const c=cv.getContext("2d"); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  const ink=css("--ink"), mut=css("--muted"), line=css("--line"), mono=css("--f-mono");
  const it=o.items||[]; const L=58,R=14,T=16,B=58, pw=w-L-R, ph=h-T-B;
  const vmax=Math.max(o.ymin||1,...it.map(i=>Math.max(i.v,i.ref||0)))*1.1, st=nice(vmax,5), top=Math.ceil(vmax/st)*st;
  const Y=v=>T+ph-v/top*ph;
  c.font=`11.5px ${mono}`; c.textAlign="right"; c.textBaseline="middle";
  for(let v=0;v<=top+1e-9;v+=st){ c.strokeStyle=line; c.lineWidth=1; c.beginPath(); c.moveTo(L,Math.round(Y(v))+.5); c.lineTo(L+pw,Math.round(Y(v))+.5); c.stroke(); c.fillStyle=mut; c.fillText(v.toFixed(Math.max(0,-Math.floor(Math.log10(st)))),L-6,Y(v)); }
  c.save(); c.translate(13,T+ph/2); c.rotate(-Math.PI/2); c.textAlign="center"; c.fillText(o.ylabel,0,0); c.restore();
  if(!it.length){ c.textAlign="center"; c.fillText(o.empty||"Results will appear here",L+pw/2,T+ph/2); return; }
  const bw=Math.min(64,pw/it.length*.6), gap=pw/it.length;
  it.forEach((i,k)=>{ const cx=L+gap*(k+.5); c.fillStyle=i.col||css("--accent"); c.globalAlpha=.85; c.fillRect(cx-bw/2,Y(i.v),bw,T+ph-Y(i.v)); c.globalAlpha=1;
    c.fillStyle=ink; c.textAlign="center"; c.textBaseline="bottom"; c.font=`600 11px ${mono}`; c.fillText(i.vl??fmt(i.v),cx,Y(i.v)-3);
    if(i.ref!=null){ c.strokeStyle=ink; c.lineWidth=2; c.setLineDash([4,3]); c.beginPath(); c.moveTo(cx-bw/2-6,Y(i.ref)); c.lineTo(cx+bw/2+6,Y(i.ref)); c.stroke(); c.setLineDash([]); }
    c.fillStyle=mut; c.textBaseline="top"; c.font=`11px ${css("--f-body")}`; const words=i.label.split(" "); let l1="",l2=""; words.forEach(wd=>{ if((l1+" "+wd).trim().length<=13&&!l2) l1=(l1+" "+wd).trim(); else l2=(l2+" "+wd).trim(); });
    c.fillText(l1,cx,T+ph+6); if(l2) c.fillText(l2,cx,T+ph+20); });
  c.strokeStyle=mut; c.lineWidth=1.4; c.beginPath(); c.moveTo(L,T); c.lineTo(L,T+ph); c.lineTo(L+pw,T+ph); c.stroke();
  if(o.refLabel&&it.some(i=>i.ref!=null)){ c.font=`11px ${css("--f-body")}`; c.textAlign="right"; c.textBaseline="middle"; c.fillStyle=ink; c.fillText(o.refLabel,L+pw-4,T+8); c.strokeStyle=ink; c.setLineDash([4,3]); c.lineWidth=2; const tw=c.measureText(o.refLabel).width; c.beginPath(); c.moveTo(L+pw-tw-28,T+8); c.lineTo(L+pw-tw-10,T+8); c.stroke(); c.setLineDash([]); }
}

<script>

<script>
/* Exam-style questions: self-marked against OCR-style mark schemes */
window.EXAM=(()=>{
const {$,$$,store}=LAB, {num}=LEARN;
const KEY="learn-ks3-science-motion-exam", saved=store.get(KEY)||{};
const save=()=>store.set(KEY,saved);
const CARDS={}, PARTS={};
const kind=`<span class="kind k-exam">Practice</span>`;
const L="abcdefghij";

/* simple graph for question figures */
function graph(o){ const w=o.w||440,h=o.h||270,ml=52,mr=14,mt=14,mb=46,pw=w-ml-mr,ph=h-mt-mb,y0=o.ymin||0;
  const X=x=>ml+x/o.xmax*pw, Y=y=>mt+(o.ymax-y)/(o.ymax-y0)*ph; let g="";
  for(let x=0;x<=o.xmax+1e-9;x+=o.xs){ const lab=Math.round(x/o.xs)%(o.xl||1)===0; g+=`<line x1="${X(x)}" y1="${mt}" x2="${X(x)}" y2="${mt+ph}" style="stroke:var(--line)" stroke-width="${lab?1:.6}"/>`; if(lab) g+=`<text x="${X(x)}" y="${mt+ph+17}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${+x.toFixed(2)}</text>`; }
  for(let y=y0;y<=o.ymax+1e-9;y+=o.ys){ const lab=Math.round((y-y0)/o.ys)%(o.yl||1)===0; g+=`<line x1="${ml}" y1="${Y(y)}" x2="${ml+pw}" y2="${Y(y)}" style="stroke:var(--line)" stroke-width="${lab?1:.6}"/>`; if(lab) g+=`<text x="${ml-7}" y="${Y(y)+4}" text-anchor="end" font-size="12" style="fill:var(--muted)">${+y.toFixed(2)}</text>`; }
  g+=`<line x1="${ml}" y1="${Y(0)}" x2="${ml+pw}" y2="${Y(0)}" style="stroke:var(--ink)" stroke-width="1.5"/><line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}" style="stroke:var(--ink)" stroke-width="1.5"/>`;
  (o.lines||[]).forEach(p=>g+=`<polyline points="${p.map(([x,y])=>`${X(x)},${Y(y)}`).join(" ")}" fill="none" style="stroke:var(--data)" stroke-width="2.6" stroke-linejoin="round"/>`);
  g+=`<text x="${ml+pw/2}" y="${h-6}" text-anchor="middle" font-size="13" style="fill:var(--ink)">${o.xt}</text><text transform="translate(14 ${mt+ph/2}) rotate(-90)" text-anchor="middle" font-size="13" style="fill:var(--ink)">${o.yt}</text>`;
  return `<figure><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${o.aria||"Graph"}">${g}</svg>${o.cap?`<figcaption class="muted" style="font-size:.85rem">${o.cap}</figcaption>`:""}</figure>`; }

const pscore=p=>{ const s=saved[p.id]; if(!s||!s.done) return null;
  if(p.opts) return s.c===p.a?1:0; if(p.lor) return +s.v||0; return (s.t||[]).filter(Boolean).length; };

function partHTML(p,qi){ const s=saved[p.id]||{};
  let body="";
  if(p.opts){ body=`<div class="xmcq">${p.opts.map((o,j)=>`<label class="${s.done?(j===p.a?"right":(j===s.c?"wrong":"")):""}"><input type="radio" name="${p.id}" value="${j}" ${s.c===j?"checked":""}><span><b>${"ABCD"[j]}</b> ${o}</span></label>`).join("")}</div><div class="xbtns"><button class="btn primary" data-xmcq="${p.id}">Check</button></div>`; }
  else { body=window.EXAM_WORK&&!p.lor?window.EXAM_WORK(p,s):`<textarea class="xans" data-xw="${p.id}" rows="${p.lines||3}" aria-label="Your answer to part ${p.l}" placeholder="Write your answer and working here">${(s.w||"").replace(/</g,"&lt;")}</textarea>`;
    if(p.ans) body+=`<div class="xfinal"><span>Final answer</span><input type="text" inputmode="decimal" data-xin="${p.id}" value="${String(s.f??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}" aria-label="Final answer" autocomplete="off"><span class="u">${p.ans.unit||""}</span><button class="btn" data-xchk="${p.id}">Check answer</button></div>`;
    body+=`<div class="xbtns"><button class="btn primary" data-xms="${p.id}">${s.done?(s.hid?"Show mark scheme":"Hide mark scheme"):"Mark it: show mark scheme"}</button></div>`; }
  let ms="";
  if(p.lor){ ms=`<div class="xmsh"><span>Levels of response mark scheme</span><span>Award: <select data-xlor="${p.id}">${Array.from({length:p.m+1},(_,i)=>`<option value="${i}" ${+s.v===i?"selected":""}>${i}</option>`).join("")}</select> / ${p.m}</span></div>${p.lor.map(([lv,d])=>`<div class="lv"><b>${lv}</b><span>${d}</span></div>`).join("")}${p.ind?`<div class="note"><b>Indicative scientific content</b><ul>${p.ind.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}`; }
  else if(!p.opts){ ms=`<div class="xmsh"><span>Mark scheme · tick each mark you earned</span><span id="${p.id}-pm"></span></div>${p.ms.map(([c,t],j)=>`<label><input type="checkbox" data-xt="${p.id}" data-j="${j}" ${(s.t||[])[j]?"checked":""}><code>${c}</code><span>${t}</span></label>`).join("")}${p.note?`<div class="note">${p.note}</div>`:""}`; }
  const fb=p.opts&&s.done?`<div class="xfb ${s.c===p.a?"ok":"nok"}">${s.c===p.a?"<b>Correct.</b> ":"<b>Not this one.</b> Answer: "+"ABCD"[p.a]+". "}${p.why||""}</div>`:"";
  return `<div class="xp" data-p="${p.id}"><div class="xpq"><span class="xpl">${p.l?`(${p.l})`:""}</span><div>${p.ht?'<span class="ht">Higher</span> ':""}${p.q}</div><span class="xm">[${p.m}]</span></div><div class="xbody">${body}${p.help&&window.EXAM_HELP?window.EXAM_HELP(p):""}<div class="xfb" id="${p.id}-fb" hidden></div>${ms?`<div class="xms" id="${p.id}-ms" ${s.done&&!s.hid?"":"hidden"}>${ms}</div>`:""}${fb}</div></div>`; }

function cardHTML(cid){ const c=CARDS[cid]; let qn=c.start||1;
  const qs=c.qs.map(q=>{ const n=qn++; const parts=q.parts.map(p=>partHTML(p)).join(""); const t=q.parts.reduce((a,p)=>a+p.m,0);
    return `<div class="xq"><div class="xq-head"><span class="xqn">${n}</span><div class="xstem">${q.stem||""}</div></div><div class="xparts">${parts}</div>${q.parts.length>1?`<div class="xqtot">Total for question ${n}: ${t} marks</div>`:""}</div>`; }).join("");
  return `<h3>${kind}${c.title} <span class="qscore" id="${cid}-score"></span></h3>${c.intro?`<p class="xintro">${c.intro}</p>`:""}${qs}<div class="xfoot"><span class="muted" id="${cid}-sum"></span><button class="btn" data-xreset="${cid}">Clear my answers</button></div>`; }

function build(cid,cfg){ let k=0; CARDS[cid]=cfg; cfg.qs.forEach((q,qi)=>q.parts.forEach((p,pi)=>{ p.id=`${cid}q${qi}${L[pi]}`; if(q.parts.length>1&&p.l==null) p.l=L[pi]; if(!p.opts&&!p.lor&&p.ms&&p.ms.length!==p.m) console.warn("mark count",p.id); p.card=cid; p.tag=p.tag||cfg.tag; PARTS[p.id]=p; }));
  const el=document.createElement("div"); el.className="lcard exam"; el.id=cid; el.innerHTML=cardHTML(cid); return el; }
function rerender(cid){ $("#"+cid).innerHTML=cardHTML(cid); refresh(cid); }
function allParts(cid){ return CARDS[cid].qs.flatMap(q=>q.parts).filter(p=>!(p.ht&&window.TIER==="f")); }
function refresh(cid){ const ps=allParts(cid), T=ps.reduce((a,p)=>a+p.m,0); let got=0,mk=0,mt=0;
  ps.forEach(p=>{ const v=pscore(p); if(v!=null){ got+=v; mk++; mt+=p.m; } const e=$(`#${p.id}-pm`); if(e&&!p.lor){ const s=saved[p.id]; e.textContent=s&&s.done?`${pscore(p)} / ${p.m}`:""; } });
  $(`#${cid}-score`).textContent=`${got} / ${T} marks`;
  $(`#${cid}-sum`).textContent=mk?`${mk} of ${ps.length} parts marked · ${got} out of ${mt} on the parts marked so far`:`${ps.length} parts · ${T} marks. Answer, then use the mark scheme to mark yourself honestly.`;
  if(CARDS[cid].onChange) CARDS[cid].onChange(); }

function attach(lid,cfg,before){ const sec=$("#lab-"+lid+" .lsec"); if(!sec) return; const cid="xm-"+lid+(cfg.suffix||"");
  const el=build(cid,{tag:lid,...cfg}); if(before){ const b=before(sec); b?sec.insertBefore(el,b):sec.appendChild(el); } else sec.appendChild(el); refresh(cid); return cid; }

document.addEventListener("click",e=>{ const t=e.target.closest("[data-xms],[data-xmcq],[data-xchk],[data-xreset],[data-xgo]"); if(!t) return;
  if(t.dataset.xgo){ location.hash=t.dataset.xgo; return; }
  if(t.dataset.xreset){ const cid=t.dataset.xreset; if(!confirm("Clear your written answers and marks for this section?")) return; allParts(cid).forEach(p=>delete saved[p.id]); save(); rerender(cid); return; }
  const id=t.dataset.xms||t.dataset.xmcq||t.dataset.xchk, p=PARTS[id], s=saved[id]=saved[id]||{};
  if(t.dataset.xmcq){ const sel=$(`input[name="${id}"]:checked`); const fb=$(`#${id}-fb`); if(!sel){ fb.hidden=false; fb.className="xfb nok"; fb.textContent="Choose an answer first."; return; } s.c=+sel.value; s.done=true; save(); rerender(p.card); return; }
  if(t.dataset.xms){ const ms=$(`#${id}-ms`); if(!s.done){ s.done=true; s.hid=false; if(!s.t) s.t=[]; } else s.hid=!s.hid; ms.hidden=!!s.hid; t.textContent=s.hid?"Show mark scheme":"Hide mark scheme"; save(); refresh(p.card); return; }
  if(t.dataset.xchk){ const raw=$(`[data-xin="${id}"]`).value, v=num(raw), fb=$(`#${id}-fb`); fb.hidden=false; s.f=raw;
    if(isNaN(v)){ fb.className="xfb nok"; fb.textContent="Enter a number or expression, such as 1/4, sqrt(2) or 3.2e-3."; save(); return; }
    const a=p.ans, tol=a.tol??0.03, x=a.abs?Math.abs(v):v, ok=NumericTools.matches(x,a.a,tol,a.atol??0);
    if(ok){ const single=p.m===1&&p.ms.length===1;
      fb.className="xfb ok"; fb.innerHTML=single?"<b>Final answer correct.</b> One mark awarded.":"<b>Final numerical value correct.</b> Open the mark scheme and tick the marks earned for working, accuracy and any explanation. A matching number alone does not establish all the required method marks.";
      s.done=true; s.hid=false; s.t=s.t||[]; if(single) s.t=[true]; save();
      const ms=$(`#${id}-ms`); ms.hidden=false; $$(`[data-xt="${id}"]`).forEach((c,j)=>c.checked=!!s.t[j]); $(`[data-xms="${id}"]`).textContent="Hide mark scheme"; refresh(p.card); }
    else { fb.className="xfb nok"; fb.innerHTML=`<b>That doesn't match.</b> ${a.hint||"Check your working, units and significant figures."} You can still pick up method marks: open the mark scheme to see which you earned.`; save(); } } });
document.addEventListener("change",e=>{ const t=e.target;
  if(t.dataset.xt){ const id=t.dataset.xt, s=saved[id]=saved[id]||{}; s.t=s.t||[]; s.t[+t.dataset.j]=t.checked; if(s.a) s.a[+t.dataset.j]=false; save(); refresh(PARTS[id].card); }
  else if(t.dataset.xlor){ const id=t.dataset.xlor, s=saved[id]=saved[id]||{}; s.v=+t.value; s.done=true; save(); refresh(PARTS[id].card); } });
document.addEventListener("input",e=>{ const t=e.target, id=t.dataset.xw||t.dataset.xin; if(id){ const s=saved[id]=saved[id]||{}; if(t.dataset.xin) s.f=t.value; else s.w=t.value; save(); } });

/* auto-marking hook: set or clear marks without revealing the scheme */
function autoMark(id,arr){ const s=saved[id]=saved[id]||{}, p=PARTS[id]; s.t=s.t||[]; s.a=s.a||[]; let ch=false;
  arr.forEach((on,j)=>{ if(on&&!s.t[j]){ s.t[j]=true; s.a[j]=true; ch=true; } else if(!on&&s.a[j]&&s.t[j]){ s.t[j]=false; s.a[j]=false; ch=true; } });
  if(arr.some(Boolean)&&!s.done){ s.done=true; s.hid=true; ch=true; }
  if(!ch) return; save(); $$(`[data-xt="${id}"]`).forEach(c=>c.checked=!!s.t[+c.dataset.j]); const b=$(`[data-xms="${id}"]`); if(b&&s.hid) b.textContent="Show mark scheme"; refresh(p.card); }
return {graph,attach,build,refresh,allParts,pscore,PARTS,CARDS,saved,autoMark,save,rerender};
})();

<script>

const sec=lesson({id,group:cfg.group||"r",num:cfg.num,lvl:cfg.lvl||"Review",name:cfg.name||"Mixed exam paper",icon:cfg.icon||"solve",tag:cfg.tag,eyebrow:cfg.eyebrow,title:cfg.title,intro:cfg.intro,

const lsec=sec.querySelector(".lsec"), ca="xm-"+id+"a", cb="xm-"+id+"b";
if(hasA) lsec.appendChild(build(ca,cfgA)); lsec.appendChild(build(cb,cfgB));
lsec.insertAdjacentHTML("beforeend",`<div class="lcard"><h3><span class="kind k-exam">Results</span>Your paper summary</h3><div class="xpaper"><div><span>Score</span><b id="${P}-sc">—</b></div><div><span>Score on parts marked</span><b id="${P}-pc">—</b></div><div><span>Parts marked</span><b id="${P}-pm">—</b></div></div><div class="xbd" id="${P}-bd"></div><p class="muted" style="margin-top:10px;font-size:.9rem">Bars show the marks you earned on the parts you have marked, grouped by lesson. Red bars are below 60 %: open that lesson to revise it.</p></div>`);
const names={}; LAB.list.forEach(p=>names[p.id]=`${(p.lvl||"").replace(/^.*Lesson /,"L")} · ${p.name}`);
function summary(){ const ps=[...(hasA?allParts(ca):[]),...allParts(cb)], T=ps.reduce((a,p)=>a+p.m,0); let got=0,mt=0,mk=0; const by={};
  ps.forEach(p=>{ const v=pscore(p), t=p.tag; by[t]=by[t]||{g:0,m:0,all:0}; by[t].all+=p.m; if(v!=null){ got+=v; mt+=p.m; mk++; by[t].g+=v; by[t].m+=p.m; } });
  $(`#${P}-total`).textContent=T; $(`#${P}-sc`).textContent=`${got} / ${T}`; $(`#${P}-pc`).textContent=mt?Math.round(got/mt*100)+" %":"—"; $(`#${P}-pm`).textContent=`${mk} of ${ps.length}`;
  const order=Object.keys(by).sort((a,b)=>+a.replace(/\D/g,"")-+b.replace(/\D/g,""));
  $(`#${P}-bd`).innerHTML=order.map(t=>{ const r=by[t], pc=r.m?r.g/r.m*100:0, low=r.m&&pc<60;

/* countdown timer */

function stop(){ clearInterval(iv); iv=null; }

$(`#${P}-reset`).addEventListener("click",()=>{ stop(); tm={left:MINS*60,run:false,at:0}; store.set(TK,tm); show(); });

<script>
/* Saved step-by-step working, numerical final checks and explicit self-marking. */
(()=>{
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");

/* ---- marking ---- */
function mark(p,lines){
  // Working may contain intermediate values equal to a final answer. It cannot
  // establish that the requested method, equation or proof has been completed.

let dl=null; (async()=>{ try{ dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null; }catch(_){ dl=null; } })();
$("#rp-go").addEventListener("click",async()=>{ const msg=$("#rp-msg"), go=$("#rp-go");
  const info={name:$("#rp-name").value.trim(),group:$("#rp-group").value.trim(),note:$("#rp-note").value.trim(),weak:$("#rp-weak").checked,strong:$("#rp-strong").checked,all:$("#rp-all").checked};
  saved.name=info.name; saved.group=info.group; store.set(NKEY,saved);
  go.disabled=true; msg.textContent="Making the PDF…";
  try{ const pdf=buildPDF(makePages(info,gather())); const fname=`${TITLE} progress${info.name?" - "+info.name.replace(/[^\w \-]/g,""):""} ${today()}.pdf`;
    if(dl){ try{ await dl.save({filename:fname,data:new Blob([pdf],{type:"application/pdf"})}); msg.textContent="Saved. If you would like to, attach the PDF to an email or a Teams message to your teacher."; }
      catch(err){ msg.textContent=err&&err.code==="declined"?"Not saved. You can try again whenever you like.":err&&err.code==="rate_limited"?"A save is already waiting for your answer.":"Saving is not available here."; } }
    else { const url=URL.createObjectURL(new Blob([pdf],{type:"application/pdf"})); const a=document.createElement("a"); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); msg.textContent="Saved to your downloads. If you would like to, attach it to an email or a Teams message to your teacher."; }
  }catch(err){ msg.textContent="Sorry, the PDF could not be made."; }
  go.disabled=false; });
window.REPORT={gather,makePages,buildPDF};

<script>
/* Accounts: Supabase sign-in, progress sync across devices, and the teacher dashboard.
   Only active when config.js provides ALP_CONFIG.url and ALP_CONFIG.key. */
(()=>{
const CFG=window.ALP_CONFIG||{};
if(!CFG.url||!CFG.key||/PASTE|YOUR/i.test(CFG.url+CFG.key)||!window.supabase) return;
const {$,$$,store}=LAB;
const sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"alp-auth"}});
const DOMAIN=CFG.emailDomain||"accounts.physicsalevel.prodigyai.uk";
const SITES={"alevel-physics":["A Level Physics","physicsalevel.prodigyai.uk"],"alevel-chemistry":["A Level Chemistry","chemistryalevel.prodigyai.uk"],"alevel-biology":["A Level Biology","biologyalevel.prodigyai.uk"],"alevel-maths":["A Level Maths","mathsalevel.prodigyai.uk"],"alevel-further-maths":["A Level Further Maths","prodigyai-app.github.io/ALevelFurtherMaths/"],"alevel-psychology":["A Level Psychology","psychologyalevel.prodigyai.uk"],"alevel-sociology":["A Level Sociology","sociologyalevel.prodigyai.uk"],"alevel-pe":["A Level PE","prodigyai-app.github.io/ALevelPE/"],"gcse-physics":["GCSE Physics","physicsgcse.prodigyai.uk"],"gcse-chemistry":["GCSE Chemistry","chemistrygcse.prodigyai.uk"],"gcse-biology":["GCSE Biology","biologygcse.prodigyai.uk"],"ks3-science":["KS3 Science","prodigyai-app.github.io/KS3Science/"],"ks3-maths":["KS3 Maths","prodigyai-app.github.io/KS3Maths/"],"gcse-maths":["GCSE Maths","mathsgcse.prodigyai.uk"],"gcse-combined":["Combined Science","combinedsciencegcse.prodigyai.uk"]};
const SITE=window.ALP_SITE&&SITES[window.ALP_SITE]?window.ALP_SITE:"alevel-physics", SITENAME=SITES[SITE][0];
const isSync=k=>/^learn-ks3-science-/.test(k);
const SPECIAL=new Set(["learn-ks3-science-motion-done","learn-ks3-science-check-state","learn-ks3-science-motion-exam","ks3-science-activity"]);
const OWNER="alp-owner";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const raw={get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },del(k){ try{ localStorage.removeItem(k); }catch(e){} },keys(){ try{ return Object.keys(localStorage); }catch(e){ return []; } }};
let user=null, profile=null, dirty=false, pushT=null, lastSync=null;

/* ---------- local progress bundle ---------- */
function gather(){ const o={}; raw.keys().filter(isSync).forEach(k=>{ try{ o[k]=JSON.parse(raw.get(k)); }catch(e){} }); return o; }
function writeAll(o){ raw.keys().filter(isSync).forEach(k=>{ if(!(k in o)) raw.del(k); }); Object.entries(o).forEach(([k,v])=>raw.set(k,JSON.stringify(v))); }
function clearLocal(){ raw.keys().filter(isSync).forEach(k=>raw.del(k)); raw.del(OWNER); }

/* merge two bundles so that no progress is lost */
function merge(a,b){ a=a||{}; b=b||{}; const out={...b,...a};
  const D="learn-ks3-science-motion-done"; if(a[D]||b[D]) out[D]=[...new Set([...(b[D]||[]),...(a[D]||[])])];
  const C="learn-ks3-science-check-state", rank={ok:3,shown:2,no:1}; if(a[C]||b[C]){ const m={...(b[C]||{})}; Object.entries(a[C]||{}).forEach(([k,v])=>{ if(!m[k]||(rank[v]||0)>(rank[m[k]]||0)) m[k]=v; }); out[C]=m; }
  const E="learn-ks3-science-motion-exam"; if(a[E]||b[E]){ const sc=s=>!s||!s.done?-1:(s.t?s.t.filter(Boolean).length:0)+(+s.v||0)+(s.c!=null?1:0); const m={...(b[E]||{})};
    Object.entries(a[E]||{}).forEach(([k,v])=>{ const w=m[k]; if(!w||sc(v)>sc(w)||(sc(v)===sc(w)&&(v.w||"").length>(w.w||"").length)) m[k]=v; }); out[E]=m; }
  const A="ks3-science-activity"; if(a[A]||b[A]){ const x=a[A]||{}, y=b[A]||{}, r={time:{},first:{},last:{},days:[]};
    new Set([...Object.keys(x.time||{}),...Object.keys(y.time||{})]).forEach(id=>{ r.time[id]=Math.max((x.time||{})[id]||0,(y.time||{})[id]||0);
      const f=[(x.first||{})[id],(y.first||{})[id]].filter(Boolean).sort(); if(f[0]) r.first[id]=f[0];
      const l=[(x.last||{})[id],(y.last||{})[id]].filter(Boolean).sort(); if(l.length) r.last[id]=l[l.length-1]; });
    r.days=[...new Set([...(x.days||[]),...(y.days||[])])].sort(); out[A]=r; }
  const plain=o=>o&&typeof o==="object"&&!Array.isArray(o);
  Object.keys(out).forEach(k=>{ if(SPECIAL.has(k)||!(k in a)||!(k in b)) return;
    if(plain(a[k])&&plain(b[k])) out[k]={...b[k],...a[k]}; else if(Array.isArray(a[k])&&Array.isArray(b[k])) out[k]=a[k].length>=b[k].length?a[k]:b[k]; });
  return out; }

/* ---------- push / pull ---------- */
const origSet=store.set.bind(store);
store.set=(k,v)=>{ origSet(k,v); if(user&&isSync(k)){ dirty=true; if(!pushT) pushT=setTimeout(()=>{ pushT=null; push(); },4000); } };
async function push(){ if(!user||!dirty) return; dirty=false; const data=gather();
  const {error}=await sb.from("progress").upsert({user_id:user.id,site:SITE,data,updated_at:new Date().toISOString()},{onConflict:"user_id,site"});
  if(error){ dirty=true; showSync("Not saved yet: will retry"); } else { lastSync=new Date(); showSync(); } }
setInterval(()=>{ if(dirty) push(); },60000);
window.addEventListener("pagehide",()=>{ if(dirty) push(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&dirty) push(); });

async function pull(){ const {data,error}=await sb.from("progress").select("data,updated_at").eq("user_id",user.id).eq("site",SITE).maybeSingle();
  if(error) return false; const server=(data&&data.data)||{}; const owner=raw.get(OWNER);
  const local=owner&&owner!==user.id?{}:gather(); const merged=merge(local,server);
  const changedLocal=JSON.stringify(sortDeep(merged))!==JSON.stringify(sortDeep(gather()))||owner!==user.id;
  if(JSON.stringify(sortDeep(merged))!==JSON.stringify(sortDeep(server))){ await sb.from("progress").upsert({user_id:user.id,site:SITE,data:merged,updated_at:new Date().toISOString()},{onConflict:"user_id,site"}); }
  writeAll(merged); raw.set(OWNER,user.id); lastSync=new Date();
  return changedLocal; }
function sortDeep(o){ if(Array.isArray(o)) return o.map(sortDeep); if(o&&typeof o==="object"){ const r={}; Object.keys(o).sort().forEach(k=>r[k]=sortDeep(o[k])); return r; } return o; }

/* ---------- header button and menu ---------- */
const head=$("header.top"); let wrap=head&&head.querySelector(".top-actions"); if(head&&!wrap){ wrap=document.createElement("div"); wrap.className="top-actions"; head.appendChild(wrap); }
const menu=document.createElement("div"); menu.className="acc-menu"; menu.innerHTML=`<button class="btn acc-btn" id="acc-b" aria-haspopup="true" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span id="acc-bl">Sign in</span></button><div class="acc-pop" id="acc-pop" hidden></div>`;
if(wrap) wrap.appendChild(menu);
function showSync(msg){ const e=$("#acc-sync"); if(e) e.textContent=msg||(lastSync?`Saved ${lastSync.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}`:""); }
function renderMenu(){ const pop=$("#acc-pop"); $("#acc-bl").textContent=user?(profile&&(profile.display_name||profile.username))||"Account":"Sign in";
  if(!user){ pop.hidden=true; return; }
  pop.innerHTML=`<div class="who"><b>${esc(profile?profile.display_name||profile.username:"")}</b>${esc(profile?profile.username:"")}${profile&&profile.role==="teacher"?" · teacher":""}</div>${profile&&profile.role==="teacher"?`<button data-acc="dash">Teacher dashboard</button>`:`<button data-acc="join">Join a class</button>`}<button data-acc="out">Sign out</button><button data-acc="del">Delete my account</button><div class="acc-sync" id="acc-sync"></div>`; showSync(); }
$("#acc-b").addEventListener("click",e=>{ e.stopPropagation(); if(!user){ openAuth("in"); return; } const p=$("#acc-pop"); p.hidden=!p.hidden; $("#acc-b").setAttribute("aria-expanded",String(!p.hidden)); });
document.addEventListener("click",e=>{ const p=$("#acc-pop"); if(p&&!p.hidden&&!e.target.closest(".acc-menu")) p.hidden=true; });
$("#acc-pop").addEventListener("click",async e=>{ const a=e.target.closest("[data-acc]"); if(!a) return; $("#acc-pop").hidden=true;
  if(a.dataset.acc==="out"){ await push(); await sb.auth.signOut(); clearLocal(); location.reload(); }
  else if(a.dataset.acc==="dash") openDash();
  else if(a.dataset.acc==="join") openJoin(false);
  else if(a.dataset.acc==="del"){ if(!confirm("Delete your account and all your saved progress on every Prodigy site across all Prodigy courses? This cannot be undone.")) return; const {error}=await sb.rpc("delete_my_account"); if(error){ alert("Sorry, the account could not be deleted: "+error.message); return; } await sb.auth.signOut(); clearLocal(); location.reload(); } });

/* ---------- sign-in / sign-up dialog ---------- */
const ov=document.createElement("div"); ov.id="acc-ov"; ov.hidden=true; ov.setAttribute("role","dialog"); ov.setAttribute("aria-modal","true"); ov.setAttribute("aria-labelledby","acc-h"); document.body.appendChild(ov);
let mode="in";
function form(){ const t=mode==="teacher";
  if(mode==="in") return `<form class="acc-form" id="acc-f" autocomplete="on"><label>Username<input name="u" autocomplete="username" required autocapitalize="none" spellcheck="false"></label><label>Password<input name="p" type="password" autocomplete="current-password" required></label><div class="acc-err" id="acc-e" role="alert"></div><button class="btn primary" type="submit">Sign in</button><p class="hint">Forgotten your password? Ask your teacher to reset it.</p></form>`;
  return `<form class="acc-form" id="acc-f" autocomplete="on"><label>Your name<input name="n" autocomplete="name" required maxlength="60"></label><label>Choose a username<input name="u" autocomplete="username" required autocapitalize="none" spellcheck="false" pattern="[A-Za-z0-9._\\-]{3,30}" title="3 to 30 letters, numbers, dots, dashes or underscores"><span class="hint">3–30 letters or numbers. You will use this to sign in.</span></label><label>Choose a password<input name="p" type="password" autocomplete="new-password" required minlength="6"></label><label>Type the password again<input name="p2" type="password" autocomplete="new-password" required minlength="6"></label>${t?`<label>Teacher code<input name="c" required autocomplete="off"><span class="hint">The secret code set up for this site.</span></label>`:`<label>Class code<input name="c" required autocomplete="off" autocapitalize="characters" maxlength="10"><span class="hint">Your teacher will give you this 6-character code. Already have an account from another of our sites? Choose Sign in instead.</span><span class="ok-note" id="acc-cn"></span></label>`}<div class="acc-err" id="acc-e" role="alert"></div><button class="btn primary" type="submit">${t?"Create teacher account":"Create account"}</button></form>`; }
function openAuth(m){ mode=m||"in"; ov.innerHTML=`<div class="acc-box"><h2 id="acc-h">${mode==="teacher"?"Teacher sign-up":"Save your progress"}</h2><p class="muted">${mode==="teacher"?"Create a teacher account to set up classes and see your students' progress.":"Sign in so your progress is saved and follows you to any device."}</p>${mode==="teacher"?"":`<div class="acc-tabs"><button class="btn" data-m="in" aria-pressed="${mode==="in"}">Sign in</button><button class="btn" data-m="new" aria-pressed="${mode==="new"}">New student</button></div>`}${form()}<div class="acc-links"><button data-skip>Continue without saving</button>${mode==="teacher"?`<button data-m="in">Back to sign in</button>`:`<button data-m="teacher">I'm a teacher</button>`}</div></div>`;
  ov.hidden=false; document.body.classList.add("acc-on"); const f=$("#acc-f"); setTimeout(()=>{ const i=f.querySelector("input"); if(i) i.focus(); },30);
  f.addEventListener("submit",submit); const cc=f.querySelector('input[name="c"]'); if(cc&&mode==="new") cc.addEventListener("input",e=>{ const v=e.target.value.trim(); if(v.length===6) checkCode(e); else { $("#acc-cn").textContent=""; } }); }
function closeAuth(){ ov.hidden=true; document.body.classList.remove("acc-on"); }
ov.addEventListener("click",e=>{ const m=e.target.closest("[data-m]"); if(m){ openAuth(m.dataset.m); return; } if(e.target.closest("[data-skip]")){ try{ sessionStorage.setItem("alp-guest","1"); }catch(_){} closeAuth(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!ov.hidden){ try{ sessionStorage.setItem("alp-guest","1"); }catch(_){} closeAuth(); } });
async function codeInfo(v){ const {data}=await sb.rpc("class_info",{class_code:v}); if(!data) throw new Error("That class code was not recognised. Check it with your teacher.");
  if(data.site!==SITE){ const o=SITES[data.site]||["another course",""]; throw new Error(`That code is for a ${o[0]} class. Use it on ${o[1]} — your username and password work there too.`); } return data; }
async function checkCode(e){ const v=e.target.value.trim(), out=$("#acc-cn"), er=$("#acc-e"); out.textContent=""; er.textContent=""; if(!v) return; try{ const d=await codeInfo(v); out.textContent=`Class: ${d.name}`; }catch(x){ er.textContent=x.message; } }
const email=u=>`${u.trim().toLowerCase()}@${DOMAIN}`;
function nice(err){ const m=(err&&err.message)||String(err||""); if(/invalid login/i.test(m)) return "Username or password is not right."; if(/already registered|already exists/i.test(m)) return "That username is already taken. Try another."; if(/invalid teacher code/i.test(m)) return "The teacher code was not accepted."; if(/invalid class code/i.test(m)) return "The class code was not accepted. Check it with your teacher."; if(/invalid username/i.test(m)) return "Usernames are 3–30 characters: letters, numbers, dots, dashes or underscores."; if(/database error/i.test(m)) return mode==="teacher"?"The teacher code was not accepted.":"The class code was not accepted. Check it with your teacher."; if(/rate limit|too many/i.test(m)) return "Too many attempts from this network. Wait a minute and try again."; if(/fetch|network/i.test(m)) return "Could not reach the server. Check your internet connection."; return m; }
async function submit(e){ e.preventDefault(); const f=e.target, err=$("#acc-e"), btn=f.querySelector('button[type="submit"]'); const v=n=>(f.elements[n]?f.elements[n].value:"").trim(); err.textContent="";
  const u=v("u").toLowerCase(); if(!/^[a-z0-9._-]{3,30}$/.test(u)){ err.textContent="Usernames are 3–30 letters, numbers, dots, dashes or underscores."; return; }
  btn.disabled=true;
  try{
    if(mode==="in"){ const {error}=await sb.auth.signInWithPassword({email:email(u),password:f.elements.p.value}); if(error) throw error; }
    else { if(f.elements.p.value!==f.elements.p2.value){ throw new Error("The two passwords do not match."); }
      const meta={username:u,display_name:v("n")}; if(mode==="teacher") meta.teacher_code=v("c"); else { await codeInfo(v("c")); meta.class_code=v("c"); }
      const {data,error}=await sb.auth.signUp({email:email(u),password:f.elements.p.value,options:{data:meta}}); if(error) throw error;
      if(!data.session){ const r=await sb.auth.signInWithPassword({email:email(u),password:f.elements.p.value}); if(r.error) throw new Error("Account created, but sign-in failed. In Supabase, turn off \"Confirm email\" (see the setup guide)."); } }
    closeAuth(); await afterSignIn(true);
  }catch(x){ err.textContent=nice(x); } btn.disabled=false; }

async function loadProfile(){ const {data}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle(); profile=data; }
async function afterSignIn(fresh){ const {data:{session}}=await sb.auth.getSession(); user=session?session.user:null; if(!user){ renderMenu(); return; }
  await loadProfile(); renderMenu(); window.dispatchEvent(new Event("prodigy-account-change")); const changed=await pull(); showSync(); if(changed){ location.reload(); return; } if(fresh&&LEARN.mark) LEARN.mark();
  if(profile&&profile.role!=="teacher"){ let asked=false; try{ asked=sessionStorage.getItem("alp-join-asked")==="1"; }catch(_){}
    if(!asked&&!(await myClassesHere()).length){ try{ sessionStorage.setItem("alp-join-asked","1"); }catch(_){} openJoin(true); } } }
async function myClassesHere(){ const {data:m}=await sb.from("memberships").select("class_id").eq("user_id",user.id); const ids=(m||[]).map(r=>r.class_id); if(!ids.length) return [];
  const {data:c}=await sb.from("classes").select("id,name,site").in("id",ids).eq("site",SITE); return c||[]; }
function openJoin(first){ ov.innerHTML=`<div class="acc-box"><h2 id="acc-h">Join your ${esc(SITENAME)} class</h2><p class="muted">${first?`You're signed in, but not yet in a ${esc(SITENAME)} class. `:""}Type the class code from your teacher so they can see your progress.</p><form class="acc-form" id="acc-j"><label>Class code<input name="c" required autocomplete="off" autocapitalize="characters" maxlength="10"></label><div class="acc-err" id="acc-e" role="alert"></div><span class="ok-note" id="acc-cn"></span><button class="btn primary" type="submit">Join class</button></form><div class="acc-links"><button data-skip>${first?"Not now":"Cancel"}</button></div></div>`;
  ov.hidden=false; document.body.classList.add("acc-on"); const f=$("#acc-j"); setTimeout(()=>f.elements.c.focus(),30);
  f.addEventListener("submit",async e=>{ e.preventDefault(); const er=$("#acc-e"), b=f.querySelector("button"); er.textContent=""; b.disabled=true;
    try{ await codeInfo(f.elements.c.value.trim()); const {data,error}=await sb.rpc("join_class",{class_code:f.elements.c.value.trim()}); if(error) throw error; $("#acc-cn").textContent=`Joined ${data.name}.`; setTimeout(closeAuth,900); }catch(x){ er.textContent=nice(x); } b.disabled=false; }); }

/* ---------- teacher dashboard ---------- */
const td=document.createElement("div"); td.id="td"; td.hidden=true; td.setAttribute("role","dialog"); td.setAttribute("aria-modal","true"); td.setAttribute("aria-labelledby","td-h"); document.body.appendChild(td);
let classes=[], cur=null, students=[], prog={}, sel=null;
/* map course structure once */
const lessons=LAB.list.filter(p=>p.unit), lessonIds=new Set(lessons.map(p=>p.id));
const units=(window.HUB_UNITS||[]).filter(u=>u.key!=="lab"&&u.key!=="papers");
const unitOf=id=>{ const p=LAB.list.find(q=>q.id===id); return p&&units.find(u=>u.groups.some(([g])=>g===p.group)); };
const cqTotal={}; lessons.forEach(p=>{ const s=document.getElementById("lab-"+p.id); cqTotal[p.id]=s?s.querySelectorAll(".qi[data-q]").length:0; });
const partLesson={}; Object.values(EXAM.PARTS).forEach(q=>{ const c=document.getElementById(q.card), s=c&&c.closest("section.lab"); if(s) partLesson[q.id]=s.id.slice(4); });
const PU=(window.HUB_UNITS||[]).find(u=>u.key==="papers"), PIDS=new Set();
const PAPERS=PU?LAB.list.filter(p=>PU.groups.some(([g])=>g===p.group)).map(p=>{ PIDS.add(p.id); const g=PU.groups.find(([g])=>g===p.group); return {id:p.id,name:p.name.replace(/:.*$/,"").trim(),set:g?g[1]:""}; }):[];
function partScore(p,s){ if(!s||!s.done) return null; if(p.opts) return s.c===p.a?1:0; if(p.lor) return +s.v||0; return (s.t||[]).filter(Boolean).length; }
function stats(d){ d=d||{}; const done=new Set((d["learn-ks3-science-motion-done"]||[]).filter(id=>lessonIds.has(id))), cs=d["learn-ks3-science-check-state"]||{}, ex=d["learn-ks3-science-motion-exam"]||{}, act=d["ks3-science-activity"]||{};
  const R={done:done.size,cok:0,cq:0,em:0,emk:0,time:Object.values(act.time||{}).reduce((a,b)=>a+b,0),last:(act.days||[]).slice(-1)[0]||null,days:(act.days||[]).length,unit:{},paper:{}};
  units.forEach(u=>R.unit[u.key]={n:0,done:0,cok:0,cq:0,em:0,emk:0,title:u.title});
  lessons.forEach(p=>{ const u=unitOf(p.id); if(!u) return; const x=R.unit[u.key]; x.n++; if(done.has(p.id)) x.done++; x.cq+=cqTotal[p.id]; R.cq+=cqTotal[p.id]; });
  Object.entries(cs).forEach(([k,v])=>{ const lid=k.split(":")[0]; const u=unitOf(lid); if(v==="ok"){ R.cok++; if(u) R.unit[u.key].cok++; } });
  Object.values(EXAM.PARTS).forEach(p=>{ const v=partScore(p,ex[p.id]); if(v==null) return; const lid=partLesson[p.id], u=unitOf(lid);
    if(PIDS.has(lid)){ const pp=R.paper[lid]=R.paper[lid]||{g:0,m:0}; pp.g+=v; pp.m+=p.m; } else { R.em+=v; R.emk+=p.m; if(u){ R.unit[u.key].em+=v; R.unit[u.key].emk+=p.m; } } });
  return R; }
const pc=(a,b)=>b?Math.round(a/b*100):null;
const pcell=(a,b)=>{ const p=pc(a,b); return p==null?`<span class="muted">–</span>`:`<span class="td-pc ${p<50?"lo":p<70?"mid":"hi"}">${p} %</span>`; };
const hm=s=>{ const m=Math.round(s/60); return m<60?`${m} min`:`${Math.floor(m/60)} h ${m%60} min`; };
const dt=d=>d?new Date(d).toLocaleDateString([], {day:"numeric",month:"short"}):"never";
async function openDash(){ td.hidden=false; document.body.classList.add("acc-on"); td.innerHTML=`<div class="td-box"><p class="muted">Loading…</p></div>`; await loadClasses(); renderDash(); }
function closeDash(){ td.hidden=true; document.body.classList.remove("acc-on"); }
async function loadClasses(){ const {data}=await sb.from("classes").select("*").eq("teacher_id",user.id).eq("site",SITE).order("created_at"); classes=data||[]; if(!cur&&classes.length) cur=classes[0].id; if(cur) await loadStudents(); }
async function loadStudents(){ students=[]; prog={}; const {data:m}=await sb.from("memberships").select("user_id").eq("class_id",cur); const ids=(m||[]).map(r=>r.user_id);
  if(ids.length){ const {data}=await sb.from("profiles").select("id,username,display_name,role,created_at").in("id",ids).order("username"); students=(data||[]).filter(s=>s.role!=="teacher"); }
  if(students.length){ const {data:pr}=await sb.from("progress").select("user_id,data,updated_at").eq("site",SITE).in("user_id",students.map(s=>s.id)); (pr||[]).forEach(r=>prog[r.user_id]={data:r.data,updated:r.updated_at,st:stats(r.data)}); } }
function renderDash(){ const c=classes.find(x=>x.id===cur);
  const rows=students.map(s=>{ const p=prog[s.id]||{st:stats({})}, S=p.st; const pd=PAPERS.filter(x=>S.paper[x.id]), pg=pd.reduce((a,x)=>a+S.paper[x.id].g,0), pm=pd.reduce((a,x)=>a+S.paper[x.id].m,0); const papers=pd.length?`${pd.length} started · ${pcell(pg,pm)}`:"";
    return `<tr data-s="${s.id}" tabindex="0"><td><b>${esc(s.display_name||s.username)}</b></td><td>${esc(s.username)}</td><td>${dt(p.updated)}</td><td class="num">${S.done} / ${lessons.length}</td><td class="num">${pcell(S.cok,S.cq)} <span class="muted">(${S.cok}/${S.cq})</span></td><td class="num">${pcell(S.em,S.emk)} <span class="muted">${S.emk?`(${S.em}/${S.emk})`:""}</span></td><td>${papers||`<span class="muted">none</span>`}</td><td class="num">${hm(S.time)}</td></tr>`; }).join("");
  td.innerHTML=`<div class="td-box"><div class="td-top"><h2 id="td-h">Teacher dashboard · ${esc(SITENAME)}</h2><div class="td-actions"><button class="btn" data-platform-assignments>Assignments</button><button class="btn" id="td-ref">Refresh</button>${students.length?`<button class="btn" id="td-csv">Download CSV</button>`:""}<button class="btn" id="td-x" aria-label="Close dashboard">✕ Close</button></div></div>
  <div class="td-classes">${classes.map(x=>`<button class="btn" data-c="${x.id}" aria-pressed="${x.id===cur}">${esc(x.name)}</button>`).join("")}<form class="td-new" id="td-nf"><input name="n" placeholder="New ${esc(SITENAME)} class name" maxlength="60" required aria-label="New class name"><button class="btn primary" type="submit">Create class</button></form></div>
  ${c?`<div class="td-code"><span>Students join <b>${esc(c.name)}</b> with class code</span><b>${esc(c.code)}</b><span class="muted">New students choose “New student”; students with an account from another site choose “Join a class” in their account menu.</span><span style="flex:1"></span><button class="btn" id="td-del-c">Delete class</button></div>`:`<div class="td-empty">Create your first class. You will get a class code to give to your students.</div>`}
  ${!classes.length?`<p class="muted" style="font-size:.9rem;margin:-6px 0 12px">Classes are separate for each site. Your ${esc(SITENAME)} classes appear here; classes on the other sites are managed from their dashboards.</p>`:""}${c?(students.length?`<div class="tbl-wrap"><table class="td-tbl"><thead><tr><th>Name</th><th>Username</th><th>Last saved</th><th class="num">Lessons done</th><th class="num">Check questions</th><th class="num">Lesson exam questions</th><th>Full papers</th><th class="num">Time</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted" style="font-size:.88rem;margin-top:8px">Percentages are of marks attempted and self-marked. Select a student for details and account options.</p>`:`<div class="td-empty">No students have joined this class yet.</div>`):""}
  <div class="td-detail" id="td-d"></div></div>`;
  if(sel&&students.some(s=>s.id===sel)) detail(sel); }
function detail(id){ sel=id; const s=students.find(x=>x.id===id), p=prog[id]||{st:stats({})}, S=p.st;
  const ur=units.map(u=>{ const x=S.unit[u.key]; return `<tr><td>${esc(x.title)}</td><td class="num">${x.done} / ${x.n}</td><td class="num">${pcell(x.cok,x.cq)}</td><td class="num">${pcell(x.em,x.emk)}</td></tr>`; }).join("");
  const pr=PAPERS.map(x=>{ const q=S.paper[x.id]; return `<tr><td>${esc(x.set?x.set+" · ":"")}${esc(x.name)}</td><td class="num">${q?`${q.g} / ${q.m}`:"–"}</td><td class="num">${q?pcell(q.g,q.m):"<span class=\"muted\">not started</span>"}</td></tr>`; }).join("");
  const opts=classes.filter(c=>c.id!==cur).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("");
  $("#td-d").innerHTML=`<div class="lcard"><h3>${esc(s.display_name||s.username)} <span class="muted" style="font-weight:400;font-size:.95rem">${esc(s.username)} · ${S.days} day${S.days===1?"":"s"} active · ${hm(S.time)}</span></h3>
   <div class="td-two"><div class="tbl-wrap"><table class="tbl-mini"><tr><th>Unit</th><th>Lessons</th><th>Checks</th><th>Exam Qs</th></tr>${ur}</table></div><div class="tbl-wrap"><table class="tbl-mini"><tr><th>Full paper</th><th>Marks</th><th>Score</th></tr>${pr}</table></div></div>
   <div class="td-actions" style="margin-top:14px"><button class="btn" id="td-pw">Reset password</button>${opts?`<select id="td-mv" aria-label="Move to class"><option value="">Move to class…</option>${opts}</select>`:""}<button class="btn" id="td-out">Remove from class</button><button class="btn" id="td-rm">Delete account</button></div></div>`;
  $("#td-d").scrollIntoView({behavior:"smooth",block:"nearest"}); }
td.addEventListener("click",async e=>{ const t=e.target;
  if(t.closest("#td-x")){ closeDash(); return; }
  if(t.closest("#td-ref")){ await loadClasses(); renderDash(); return; }
  const cb=t.closest("[data-c]"); if(cb){ cur=cb.dataset.c; sel=null; await loadStudents(); renderDash(); return; }
  const tr=t.closest("tr[data-s]"); if(tr){ detail(tr.dataset.s); return; }
  if(t.closest("#td-csv")){ csv(); return; }
  if(t.closest("#td-del-c")){ const c=classes.find(x=>x.id===cur); if(!confirm(`Delete the class “${c.name}”? Students keep their accounts and progress but leave the class.`)) return; const {error}=await sb.from("classes").delete().eq("id",cur); if(error){ alert(error.message); return; } cur=null; sel=null; await loadClasses(); renderDash(); return; }
  if(t.closest("#td-pw")){ const np=prompt("New password for this student (at least 6 characters). Tell them the new password; they can keep using it."); if(!np) return; const {error}=await sb.rpc("reset_student_password",{student:sel,new_password:np}); alert(error?("Not changed: "+error.message):"Password changed."); return; }
  if(t.closest("#td-out")){ const s=students.find(x=>x.id===sel); if(!confirm(`Remove ${s.display_name||s.username} from this class? Their account and progress are kept.`)) return; const {error}=await sb.rpc("remove_from_class",{student:sel,from_class:cur}); if(error){ alert(error.message); return; } sel=null; await loadStudents(); renderDash(); return; }
  if(t.closest("#td-rm")){ const s=students.find(x=>x.id===sel); if(!confirm(`Permanently delete ${s.display_name||s.username}'s account and all their progress on every site?`)) return; const {error}=await sb.rpc("delete_student",{student:sel}); if(error){ alert(error.message); return; } sel=null; await loadStudents(); renderDash(); return; } });
td.addEventListener("change",async e=>{ if(e.target.id==="td-mv"&&e.target.value){ const {error}=await sb.rpc("move_student",{student:sel,from_class:cur,to_class:e.target.value}); if(error){ alert(error.message); return; } sel=null; await loadStudents(); renderDash(); } });
td.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const tr=e.target.closest("tr[data-s]"); if(tr) detail(tr.dataset.s); } if(e.key==="Escape") closeDash(); });
td.addEventListener("submit",async e=>{ if(e.target.id!=="td-nf") return; e.preventDefault(); const n=e.target.elements.n.value.trim(); if(!n) return; const {data,error}=await sb.rpc("create_class",{class_name:n,for_site:SITE}); if(error){ alert(error.message); return; } cur=(Array.isArray(data)?data[0]:data).id; sel=null; await loadClasses(); renderDash(); });
function csv(){ const c=classes.find(x=>x.id===cur); const head=["Name","Username","Last saved","Lessons done","Lessons total","Check questions right","Check questions total","Lesson exam marks","Lesson exam marks attempted",...PAPERS.flatMap(p=>{ const n=(p.set?p.set+" · ":"")+p.name; return [`${n} marks`,`${n} attempted`]; }),"Minutes"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[head.map(q).join(",")].concat(students.map(s=>{ const p=prog[s.id]||{st:stats({})}, S=p.st; return [s.display_name||"",s.username,p.updated?new Date(p.updated).toISOString().slice(0,10):"",S.done,lessons.length,S.cok,S.cq,S.em,S.emk,...PAPERS.flatMap(x=>S.paper[x.id]?[S.paper[x.id].g,S.paper[x.id].m]:["",""]),Math.round(S.time/60)].map(q).join(","); }));
  const url=URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv"})); const a=document.createElement("a"); a.href=url; a.download=`${SITE}_${(c?c.name:"class").replace(/[^\w-]+/g,"_")}_progress.csv`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); }

(async()=>{ const {data:{session}}=await sb.auth.getSession(); if(session){ await afterSignIn(false); }
  else { renderMenu(); let guest=false; try{ guest=sessionStorage.getItem("alp-guest")==="1"; }catch(_){} if(!guest) openAuth("in"); } })();
